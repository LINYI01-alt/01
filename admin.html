<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>内容管理 - 邻伊</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="images/logo.png" type="image/png">
  <style>
    .admin-wrap{max-width:1200px;margin:36px auto;padding:0 20px 60px}
    .admin-card{background:var(--warm-white);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:26px;margin:20px 0}
    .admin-card h1,.admin-card h2{color:var(--deep-green);margin-bottom:12px}
    .admin-form{max-width:440px;display:grid;gap:14px}
    .admin-form label,.submission-form label{display:grid;gap:6px;color:var(--deep-green);font-weight:600}
    .admin-form input,.submission-form input,.submission-form select,.submission-form textarea{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;background:#fff;font:inherit;color:var(--text)}
    .admin-form button{justify-self:start}
    .notice{margin:12px 0;color:var(--text-light);min-height:1.5em}
    .notice.error{color:#a33232}.notice.success{color:#23734b}
    .admin-toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:18px 0}
    .admin-toolbar select{padding:9px;border:1px solid var(--border);border-radius:8px}
    .admin-table-wrap{overflow-x:auto}
    .admin-table{width:100%;border-collapse:collapse;min-width:850px}
    .admin-table th,.admin-table td{padding:12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
    .admin-table th{color:var(--deep-green);background:var(--soft-gray)}
    .admin-table td small{display:block;color:var(--text-light);margin-top:6px}
    .content-cell{max-width:360px;white-space:pre-wrap;overflow-wrap:anywhere}
    .status{display:inline-block;padding:4px 9px;border-radius:20px;background:#eee;font-size:.85rem}
    .status-pending{background:#fff2cf;color:#805e00}.status-approved{background:#dff3e6;color:#21633b}.status-rejected{background:#fbe4e4;color:#913232}
    .row-actions{display:flex;gap:6px;flex-wrap:wrap}
    .small-button{border:0;border-radius:6px;padding:7px 10px;cursor:pointer}
    .approve{background:#dff3e6;color:#21633b}.reject{background:#fff2cf;color:#805e00}.delete{background:#fbe4e4;color:#913232}
    .security-note{font-size:.92rem;color:var(--text-light);background:var(--soft-gray);padding:14px;border-radius:8px}
    [hidden]{display:none!important}
    @media(max-width:600px){.admin-card{padding:18px}.admin-wrap{margin-top:20px}}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo-area">
        <img src="images/logo.png" alt="邻伊 Logo">
        <div class="logo-text">邻伊<span>内容管理</span></div>
      </a>
      <a href="index.html" class="btn btn-outline">返回网站</a>
    </div>
  </header>

  <main class="admin-wrap">
    <section class="admin-card" id="loginPanel">
      <h1>管理员登录</h1>
      <p class="security-note">此页面地址不公开展示，但隐藏地址不等于安全措施。实际数据权限由 Supabase 登录身份和数据库 RLS 规则控制。</p>
      <form id="adminLoginForm" class="admin-form">
        <label>管理员邮箱
          <input id="adminEmail" type="email" autocomplete="username" required>
        </label>
        <label>密码
          <input id="adminPassword" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit" class="btn btn-primary">登录后台</button>
      </form>
      <p id="loginMessage" class="notice" role="status" aria-live="polite"></p>
    </section>

    <section id="dashboard" hidden>
      <div class="admin-card">
        <h1>投稿审核</h1>
        <p>当前登录：<strong id="adminUser"></strong></p>
        <div class="admin-toolbar">
          <label for="statusFilter">审核状态：</label>
          <select id="statusFilter">
            <option value="all">全部</option>
            <option value="pending" selected>待审核</option>
            <option value="approved">已通过</option>
            <option value="rejected">已退回</option>
          </select>
          <button id="refreshSubmissions" class="btn btn-outline" type="button">刷新</button>
          <button id="logoutButton" class="btn btn-outline" type="button">退出登录</button>
        </div>
        <p id="dashboardMessage" class="notice" role="status" aria-live="polite"></p>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead><tr><th>投稿信息</th><th>内容</th><th>联系方式</th><th>状态</th><th>操作</th></tr></thead>
            <tbody id="submissionRows"></tbody>
          </table>
        </div>
      </div>

      <section class="admin-card" id="aiArticleSection">
        <h2>AI 科普文章管理</h2>
        <p>输入主题生成草稿，编辑确认后手动发布。未发布内容仅管理员可见。</p>
        <div class="admin-form" style="max-width:760px">
          <label>文章主题<input id="aiArticleTopic" type="text" maxlength="300" placeholder="例如：AMH 检查是什么？"></label>
          <button id="generateAiArticle" class="btn btn-primary" type="button">生成文章草稿</button>
        </div>
        <p id="aiArticleMessage" class="notice" role="status" aria-live="polite"></p>
        <div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>文章</th><th>操作</th></tr></thead><tbody id="aiArticleRows"></tbody></table></div>
        <div id="aiArticleEditor" hidden style="margin-top:22px">
          <h3>编辑文章</h3>
          <div class="admin-form" style="max-width:900px">
            <label>标题<input id="aiArticleTitle" maxlength="200"></label>
            <label>摘要<textarea id="aiArticleSummary" rows="3"></textarea></label>
            <label>正文<textarea id="aiArticleContent" rows="18"></textarea></label>
            <div class="admin-toolbar"><button id="saveAiArticle" class="btn btn-outline" type="button">保存草稿</button><button id="publishAiArticle" class="btn btn-primary" type="button">手动发布</button></div>
          </div>
        </div>
      </section>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
